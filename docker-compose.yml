version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - infra/.env
    command: ["uv", "run", "python", "-m", "tg_bot_meal_planning.interface.telegram.run_bot"]
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/var/sqlite/app.db}
    volumes:
      - ./:/app
      - sqlite_data:/app/var/sqlite
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"

volumes:
  sqlite_data:
