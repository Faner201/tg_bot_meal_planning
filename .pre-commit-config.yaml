repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format



  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run python -m ty check .
        language: system
        types: [python]



