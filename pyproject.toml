[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-bot-meal-planning"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "SQLAlchemy>=2.0.34",
    "alembic>=1.13.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiogram>=3.13.1",
    "typing_extensions>=4.12.2",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.7.0",
    "pytest-asyncio>=0.24.0",
    "ty==0.0.1a33",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tg_bot_meal_planning"]

[tool.uv]
# uv использует стандартный PEP 621; дополнительные опции будем добавлять по мере развития

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "I",  # isort
    "Q",
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "UP",  # pyupgrade
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "ISC",  # flake8-implicit-str-concat
    "ASYNC",  # flake8-async
    "T20",  # print and pprint
    "ANN",  # flake8-annotations
    "TCH",  # flake8-type-checking
    "PT",  # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "C90",  # mccabe
    "FAST",  # FastAPI
    "SIM",  # flake8-simplify
]
ignore = [
    "E203",
    "E501",  # line too long, handled by Ruff formatting
    "B008",  # do not perform function calls in argument defaults
    "F821",  # checks for uses of undefined names, breaks sqlalchemy models
    "UP007",  # large models are unreadable
    "UP032",  # allows str .format
    "ANN401",  # allows type Any
    "RUF012",  # typing.ClassVar
    "RUF002",  # docstring contains ambiguous
    "RUF001",
    "RUF003",
    "RUF100",  # Unused `noqa` directive
    "W291",  # Trailing whitespace
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"conftest.py" = ["F401"]
"tests/*" = ["S"]
