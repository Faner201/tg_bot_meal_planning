[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-bot-meal-planning"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tg_bot_meal_planning"]

[tool.uv]
# uv использует стандартный PEP 621; дополнительные опции будем добавлять по мере развития

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"


